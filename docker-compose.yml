# One-command MySQL for the pipeline:   docker compose up -d
# Credentials come from .env (copy .env.example first).
services:
  mysql:
    image: mysql:8.0
    container_name: fashion_dw_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --local-infile=1                 # allow LOAD DATA LOCAL INFILE (bulk load)
      - --innodb-buffer-pool-size=1G     # keep the ~1M-row fact table + indexes in memory
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --cte-max-recursion-depth=10000  # dim_date is built with a recursive CTE
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
